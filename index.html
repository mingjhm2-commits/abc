<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JWS</title>
<meta name="description" content="JWS의 개인 홈페이지">
<style>
  :root {
    --bg: #fafafa;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --line: #e2e2e2;
    --accent: #2f4fd8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151515;
      --text: #ececec;
      --muted: #9a9a9a;
      --line: #2e2e2e;
      --accent: #8aa2ff;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 17px; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    line-height: 1.7;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 18vh 24px 80px;
  }
  h1 {
    font-size: 3.4rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.1;
  }
  .intro {
    margin-top: 20px;
    color: var(--muted);
  }
  section { margin-top: 56px; }
  h2 {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--muted);
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 16px;
  }
  ul { list-style: none; }
  li { padding: 4px 0; }
  a {
    color: var(--accent);
    text-decoration: none;
  }
  a:hover { text-decoration: underline; }
  a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }
  footer {
    margin-top: 72px;
    font-size: 0.85rem;
    color: var(--muted);
  }
</style>
</head>
<body>
  <main class="wrap">
    <h1>JWS</h1>
    <p class="intro">안녕하세요, JWS입니다. 이곳은 제 개인 홈페이지입니다.</p>

    <section>
      <h2>소개</h2>
      <p>여기에 자신에 대한 짧은 소개를 적어 주세요. 하는 일, 관심사, 좋아하는 것 등을 자유롭게 써도 좋습니다.</p>
    </section>

    <section>
      <h2>프로젝트</h2>
      <ul>
        <li><a href="#">프로젝트 이름</a> – 한 줄 설명</li>
        <li><a href="#">프로젝트 이름</a> – 한 줄 설명</li>
      </ul>
    </section>

    <section>
      <h2>연락처</h2>
      <ul>
        <li><a href="mailto:hello@example.com">hello@example.com</a></li>
        <li><a href="https://github.com/" target="_blank" rel="noopener">GitHub</a></li>
      </ul>
    </section>

    <footer>© 2026 JWS</footer>
  </main>
</body>
</html>
